<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeCheck — Verdict</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #111722;
    --panel-edge: #1d2635;
    --text: #e8edf5;
    --dim: #8b98ab;
    --green: #2fd67b;
    --green-dim: rgba(47, 214, 123, 0.14);
    --red: #ff5d6c;
    --red-dim: rgba(255, 93, 108, 0.14);
    --amber: #ffb454;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 48px 24px 64px;
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(47, 214, 123, 0.07), transparent);
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 8px; }
  .wordmark { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .wordmark b { color: var(--text); }
  .pin { font-family: var(--mono); font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid var(--panel-edge); padding: 4px 10px; border-radius: 999px; }

  .banner {
    border-radius: 16px;
    padding: 36px 32px;
    margin-bottom: 24px;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    position: relative;
    overflow: hidden;
  }
  .banner .program { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-bottom: 8px; }
  .banner .status { font-size: 44px; font-weight: 800; letter-spacing: 1px; }
  .banner .headline { margin-top: 10px; color: var(--dim); font-size: 16px; line-height: 1.5; max-width: 640px; }
  .banner.verified { border-color: rgba(47, 214, 123, 0.4); box-shadow: 0 0 60px rgba(47, 214, 123, 0.12) inset; }
  .banner.verified .status { color: var(--green); text-shadow: 0 0 24px rgba(47, 214, 123, 0.5); }
  .banner.bug_found { border-color: rgba(255, 93, 108, 0.45); box-shadow: 0 0 60px rgba(255, 93, 108, 0.12) inset; }
  .banner.bug_found .status { color: var(--red); text-shadow: 0 0 24px rgba(255, 93, 108, 0.5); }
  .banner.failed { border-color: #3a465c; }
  .banner.failed .status { color: var(--amber); }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 14px; padding: 20px 22px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); margin-bottom: 14px; font-weight: 600; }

  .chip-row { display: flex; flex-direction: column; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.pass { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.fail { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .chip .detail { color: var(--dim); font-size: 12px; margin-left: auto; text-align: right; max-width: 60%; font-family: inherit; }

  .bar-track { height: 10px; background: #0d1320; border-radius: 999px; overflow: hidden; border: 1px solid var(--panel-edge); }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #1f9e5c, var(--green)); border-radius: 999px; transition: width 0.8s ease; }
  .bar-fill.partial { background: linear-gradient(90deg, #b8434f, var(--red)); }
  .bar-label { margin-top: 10px; font-size: 13px; color: var(--dim); }
  .bar-label b { color: var(--text); font-family: var(--mono); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); padding: 8px 10px; font-weight: 600; }
  td { padding: 10px; border-top: 1px solid var(--panel-edge); font-size: 14px; vertical-align: top; }
  td.name { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  td.claim { color: var(--dim); font-size: 13px; line-height: 1.45; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.equivalent { color: var(--green); background: var(--green-dim); }
  .badge.divergent { color: var(--red); background: var(--red-dim); }
  .badge.expected { color: var(--amber); background: rgba(255, 180, 84, 0.12); font-weight: 600; }
  .badge.unknown { color: var(--dim); background: rgba(139, 152, 171, 0.12); }
  tr.divergent-row td { background: rgba(255, 93, 108, 0.04); }
  .counterexample { margin-top: 8px; font-family: var(--mono); font-size: 12.5px; color: var(--text); background: #0d1320; border: 1px solid var(--panel-edge); border-radius: 8px; padding: 8px 12px; display: inline-block; }
  .counterexample span { color: var(--dim); }

  pre.run {
    background: #0d1320; border: 1px solid var(--panel-edge); border-radius: 10px;
    padding: 14px 16px; font-family: var(--mono); font-size: 12.5px; color: var(--dim);
    white-space: pre-wrap; overflow-x: auto;
  }
  .run-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .exit-ok { color: var(--green); font-family: var(--mono); font-size: 12px; }
  .exit-bad { color: var(--red); font-family: var(--mono); font-size: 12px; }

  footer { margin-top: 32px; text-align: center; color: #46536a; font-size: 12px; line-height: 1.6; }
  footer a { color: #5d6c85; }
  .loading, .error-box { padding: 60px 20px; text-align: center; color: var(--dim); }
  .error-box { color: var(--red); font-family: var(--mono); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark"><b>VibeCheck</b> · verdict</div>
    <div class="pin" id="pin">semantic-mips —</div>
  </header>

  <div id="content"><div class="loading">reading verdict…</div></div>

  <footer>
    formally verified MIPS semantics · kernel-checked proofs · differentially validated against MARS 4.5<br>
    <a href="https://github.com/rShyvers/semantic-mips">rShyvers/semantic-mips</a> (pinned submodule) · <a href="https://github.com/rShyvers/VibeCheck">rShyvers/VibeCheck</a>
  </footer>
</div>

<script>
// null/undefined render as empty text, numbers (including 0 and negatives) as their digits.
const esc = s => (s === null || s === undefined ? "" : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(v) {
  const status = v.status || "failed";
  const bannerClass = status === "verified" ? "verified" : status === "bug_found" ? "bug_found" : "failed";
  const bannerText = status === "verified" ? "VERIFIED" : status === "bug_found" ? "BUG FOUND" : "FAILED";

  let html = `<div class="banner ${bannerClass}">
      ${v.program ? `<div class="program">${esc(v.program)}</div>` : ""}
      <div class="status">${bannerText}</div>
      ${v.headline ? `<div class="headline">${esc(v.headline)}</div>` : ""}
    </div>`;

  const cards = [];

  if (Array.isArray(v.gates) && v.gates.length) {
    cards.push(`<div class="card"><h2>Verification gates</h2><div class="chip-row">` +
      v.gates.map(g => `<div class="chip"><span class="dot ${g.status === "pass" ? "pass" : "fail"}"></span>${esc(g.name || "(unnamed gate)")}` +
        (g.detail ? `<span class="detail">${esc(g.detail)}</span>` : "") + `</div>`).join("") + `</div></div>`);
  }

  if (v.differential) {
    const d = v.differential;
    const total = Number(d.total) || 0, passed = Number(d.passed) || 0;
    const pct = total > 0 ? Math.min(100, Math.max(0, Math.round(100 * passed / total))) : 0;
    const allAgree = total > 0 && passed === total;
    cards.push(`<div class="card"><h2>Differential vs ${esc(d.oracle || "reference")}</h2>
      <div class="bar-track"><div class="bar-fill${allAgree ? "" : " partial"}" style="width:${pct}%"></div></div>
      <div class="bar-label"><b>${esc(passed)}/${esc(total)}</b> programs agree with the reference simulator</div></div>`);
  }

  if (cards.length) html += `<div class="cards">${cards.join("")}</div>`;

  if (Array.isArray(v.equivalence) && v.equivalence.length) {
    html += `<div class="card" style="margin-bottom:24px"><h2>Equivalence claims</h2><table>
      <tr><th></th><th>claim</th><th style="width:170px"></th></tr>` +
      v.equivalence.map(c => {
        const div = c.status === "divergent";
        let cell;
        if (div) {
          const ce = c.counterexample;
          cell = `<span class="badge divergent">divergent</span>` +
            (c.expected === true ? ` <span class="badge expected">planted bug — caught</span>` : "") +
            (ce ? `<div class="counterexample"><span>input</span> ${esc(ce.input)} <span>→ base</span> ${esc(ce.base)}<span>, variant</span> ${esc(ce.variant)}</div>` : "");
        } else if (c.status === "equivalent") {
          cell = `<span class="badge equivalent">equivalent</span>`;
        } else {
          cell = `<span class="badge unknown">${esc(c.status || "no result")}</span>`;
        }
        return `<tr${div ? ' class="divergent-row"' : ""}><td class="name">${esc(c.name)}</td><td class="claim">${esc(c.claim || "")}</td><td>${cell}</td></tr>`;
      }).join("") + `</table></div>`;
  }

  if (v.run) {
    const ok = v.run.exit_code === 0;
    const exitText = v.run.exit_code === null || v.run.exit_code === undefined ? "?" : v.run.exit_code;
    html += `<div class="card"><div class="run-head"><h2 style="margin:0">Harness run</h2>
      <span class="${ok ? "exit-ok" : "exit-bad"}">exit ${esc(exitText)}</span></div>
      <pre class="run">${esc(v.run.output || "")}</pre></div>`;
  }

  document.getElementById("content").innerHTML = html;
  if (v.semantic_mips && v.semantic_mips.commit) {
    document.getElementById("pin").textContent =
      `semantic-mips @ ${String(v.semantic_mips.commit).slice(0, 7)}`;
  }
}

fetch("/verdict.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById("content").innerHTML =
      `<div class="error-box">could not load verdict — ${esc(e.message)}<br>run from the repo root: make install &amp;&amp; make run</div>`;
  });
</script>
</body>
</html>
