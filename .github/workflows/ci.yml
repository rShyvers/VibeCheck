name: ci

on:
  pull_request:
  push:
    branches: [main]

# The Lean project (Semantic MIPS) was extracted to its own repo
# (github.com/rShyvers/semantic-mips) and has its own CI there. This
# workflow only covers what's left in this repo: the RULES.md requirement
# that a fresh clone builds and runs.

jobs:
  make-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "RULES.md requirement: fresh clone -> make install && make run"
        run: |
          make install
          make run
