name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan + Lean toolchain (pinned in MipsSim/lean-toolchain)
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
      - name: Restore .lake cache (packages + mathlib build)
        uses: actions/cache@v4
        with:
          path: MipsSim/.lake
          key: lake-${{ hashFiles('MipsSim/lake-manifest.json') }}-${{ hashFiles('MipsSim/lean-toolchain') }}
      - name: Fetch mathlib build cache (no-op when restored from cache)
        run: cd MipsSim && ~/.elan/bin/lake exe cache get
      - name: Build all targets (MipsSim incl. StepSpec, Checked, DiffHarness; includes unit tests / #guard)
        run: cd MipsSim && ~/.elan/bin/lake build MipsSim Checked DiffHarness
      - name: Kernel replay gate (lake check on the zero-sorry target)
        run: cd MipsSim && ~/.elan/bin/lake check
      - name: Trusted-statement gate (lake comparator on the 8-theorem trusted surface)
        run: cd MipsSim && ~/.elan/bin/lake comparator

  make-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "RULES.md requirement: fresh clone -> make install && make run"
        run: |
          make install
          make run
